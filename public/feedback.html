<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>宠AI · 留言反馈</title><style>
:root{font-family:Manrope,system-ui,sans-serif;color:#263C35;background:#EFEEE8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:680px;margin:24px auto;background:#fff;border:1px solid #E3E7DE;border-radius:24px;padding:32px}a{color:#356852}h1{font-size:30px;line-height:36px;margin:24px 0 12px}p,label,input,textarea,select,button{font:inherit;font-size:14px;line-height:20px}p{color:#63756D}label{display:block;margin:24px 0 8px;font-weight:600}input,textarea,select{width:100%;padding:12px;border:1px solid #D5DFCA;border-radius:8px;background:#FAFBF7;color:#263C35}textarea{resize:vertical;min-height:160px}button{border:1px solid #356852;border-radius:12px;padding:8px 12px;background:#356852;color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:hover{background:#295440}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8FAE85;outline-offset:2px}.note{background:#F1F5EC;padding:16px;border-radius:12px}.count{text-align:right;font-size:12px;line-height:16px}#status{overflow-wrap:anywhere;padding:12px 0;white-space:pre-wrap}#status[data-error=true]{color:#A34630}#turnstile{margin-top:16px;max-width:100%;overflow:hidden}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}small{font-size:12px;line-height:16px;color:#63756D}@media(max-width:700px){body{padding:12px}main{padding:24px 16px;margin:12px auto}h1{font-size:24px;line-height:32px}}
</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><main><a href="./">← 返回宠AI</a><h1>把你的想法，留给我们</h1><p>遇到问题，或有更好的点子，都可以在这里留言。</p><div class="note"><p>留言不公开。我们不会自动附上聊天、档案或照片，请只填写必要的信息。暂无实时客服，也不保证即时回复。</p><p>内容及可选联系邮箱保存在 Supabase，供项目维护者查看和处理。可在主页面底部查看完整隐私说明。</p></div><p id="identity" role="status">正在准备留言服务…</p><form id="feedback-form"><label for="category">留言类型</label><select id="category"><option value="bug">功能或操作问题</option><option value="answer">回答内容问题</option><option value="suggestion">功能建议</option><option value="other">其他</option></select><label for="message">留言内容 *</label><textarea id="message" required minlength="5" maxlength="2000" placeholder="请描述发生了什么、你期望的结果，以及方便复现的操作步骤。至少5字，最多2000字。" aria-describedby="count"></textarea><p class="count" id="count">0 / 2000</p><label for="email">联系邮箱（选填）</label><input id="email" type="email" maxlength="160" autocomplete="email" placeholder="希望收到联系时再填写"><p><small>不要填写密码、密钥、身份证件或宠物主人以外的个人资料。</small></p><div id="turnstile"></div><p id="status" role="status" aria-live="polite"></p><div class="actions"><small>提交后请保留回执编号。</small><button id="submit" type="submit" disabled>提交留言</button></div></form></main><script>
'use strict';
(()=>{const $=id=>document.getElementById(id);let config,client=null,token='',widget=null,session=null,busy=false;
const api=location.protocol==='file:'?'https://petai-worker.bobo20241113.workers.dev':location.origin;
function status(text,error=false){$('status').textContent=text;$('status').dataset.error=String(error)}
async function json(path,options={}){const response=await fetch(api+path,{...options,cache:'no-store',signal:AbortSignal.timeout(30000)});let data;try{data=await response.json()}catch{throw Error('服务返回异常，请稍后重试。')}if(!response.ok)throw Error(data.error?.message||'提交失败，请稍后重试。');return data}
async function verify(){if(session)return;if(!config.turnstileSiteKey)throw Error('访客留言验证暂不可用，请先在主页面登录，再刷新此页。');
 await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.async=true;script.onload=resolve;script.onerror=()=>reject(Error('验证组件加载失败，请检查网络后刷新。'));document.head.append(script)});
 widget=window.turnstile.render($('turnstile'),{sitekey:config.turnstileSiteKey,action:'feedback',theme:'light',callback:value=>{token=value;status('验证通过，可以提交留言。')},'expired-callback':()=>{token='';status('请重新完成验证。',true)},'error-callback':()=>{token='';status('验证失败，请刷新后重试。',true)}});
}
async function init(){try{config=await json('/api/config');if(window.supabase&&config.supabaseUrl&&config.supabasePublishableKey){client=window.supabase.createClient(config.supabaseUrl,config.supabasePublishableKey,{auth:{storageKey:'petai.auth.'+new URL(config.supabaseUrl).hostname,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});session=(await client.auth.getSession()).data.session;}
 $('identity').textContent=session?'已登录，可直接提交留言。':'访客也可以留言，请先完成下方验证。';await verify();$('submit').disabled=false;
 }catch(e){status(e.message||'留言服务暂不可用，请稍后刷新。',true)}}
$('message').addEventListener('input',()=>$('count').textContent=$('message').value.length+' / 2000');
$('feedback-form').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;const message=$('message').value.trim();if(message.length<5){status('请至少填写5个字，说明遇到的问题。',true);$('message').focus();return}if(!$('feedback-form').reportValidity())return;
 busy=true;$('submit').disabled=true;$('submit').textContent='正在提交…';status('正在保存留言，请稍候…');
 try{if(client)session=(await client.auth.getSession()).data.session;if(!session&&!token)throw Error('请先完成验证；如果刚退出登录，请刷新此页。');
 const headers={'Content-Type':'application/json'};if(session)headers.Authorization='Bearer '+session.access_token;
 const data=await json('/api/feedback',{method:'POST',headers,body:JSON.stringify({category:$('category').value,message,email:$('email').value.trim(),...(!session?{turnstile_token:token}:{})})});
 status('留言已保存。回执编号：'+data.id+'\n请保留编号，维护者将通过后台查看；如需删除留言，也可提交该编号说明。');$('feedback-form').reset();$('count').textContent='0 / 2000';
 }catch(e){status(e.name==='TimeoutError'?'等待超时，留言可能已保存，请稍后再确认或重试。':e.message||'提交失败，请稍后重试。',true)}finally{busy=false;$('submit').disabled=false;$('submit').textContent='提交留言';token='';if(widget!==null)window.turnstile.reset(widget)}
});window.addEventListener('DOMContentLoaded',init);
})();
</script></body></html>
